# SARAS AI continuous integration. Paths are relative to the repository root (this
# SARAS.AI folder). No ML models are installed or downloaded: the tests use the lexical
# grader and the PDF text-layer OCR.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SARAS_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Unit and API tests
        run: python -m pytest -q
      - name: End-to-end API smoke test
        run: python scripts/smoke_api.py

  frontend:
    name: Frontend build (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check and build
        run: npm run build

  docker:
    name: Docker image and compose file
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      # Dummy values: only used to validate the compose file, never deployed.
      SARAS_JWT_SECRET: ci-only-not-a-real-secret
      SARAS_DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - name: Build image
        run: docker build -t saras-ai:ci .
      - name: Validate the HTTPS overlay
        env:
          SARAS_DOMAIN: saras.example.com
        run: docker compose -f docker-compose.yml -f deploy/docker-compose.https.yml config --quiet
      - name: Container smoke test (health, SPA, security headers)
        run: |
          docker run -d --name saras -p 8000:8000 \
            -e SARAS_JWT_SECRET=ci-only-not-a-real-secret-0123456789abcdef saras-ai:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/ready
          curl -fsSI http://127.0.0.1:8000/ | tee headers.txt
          grep -qi "^content-security-policy:" headers.txt
          grep -qi "^x-frame-options: DENY" headers.txt
      - name: Container logs on failure
        if: failure()
        run: docker logs saras || true
