[pytest]
# Run from backend/:  .venv/Scripts/python.exe -m pytest -q -p no:cacheprovider
# Single process on purpose (4 GB laptop profile): no xdist.
testpaths = tests
pythonpath = .
markers =
    settings(**overrides): per-test overrides of the test Settings (see tests/conftest.py)
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient`
