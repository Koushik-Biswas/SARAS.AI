# Render Blueprint: the SARAS AI backend (FastAPI API + job worker) as one Docker web service.
# One-click deploy: https://dashboard.render.com/blueprint/new?repo=https://github.com/Koushik-Biswas/SARAS.AI
#
# FREE plan: no persistent disk, so the SQLite database and uploads are WIPED on every
# restart / redeploy / ~15 min idle spin-down. Fine for a demo. For real use switch to
# plan: starter and add:
#   disk: { name: saras-data, mountPath: /data, sizeGB: 5 }
services:
  - type: web
    name: saras-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SARAS_ENV
        value: prod
      - key: SARAS_JWT_SECRET
        generateValue: true
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: WEB_CONCURRENCY
        value: "1"           # the app keeps per-process state: exactly one process
      - key: SARAS_CORS_ORIGINS
        sync: false          # enter your Vercel URL as JSON, e.g. ["https://saras-ai.vercel.app"]
      - key: SARAS_AI_GRADING
        value: "off"         # "ensemble" + SARAS_AI_CONSENT=true + a key enables AI marking
      - key: SARAS_GROQ_API_KEY
        sync: false          # optional; leave empty to stay offline
      - key: SARAS_GEMINI_API_KEY
        sync: false
