<svg xmlns="http://www.w3.org/2000/svg" width="960" height="452" viewBox="0 0 960 452" role="img" aria-label="Ensemble confidence and routing to auto-accept or teacher review" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Ensemble confidence and routing to auto-accept or teacher review</title>
<defs>
<linearGradient id="gAccent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d5ef5"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8f88d6"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="451" rx="14" fill="#fcfcff" stroke="#e4e1f7"/>
<rect x="0.5" y="0.5" width="959" height="5" rx="2" fill="url(#gAccent)"/>
<text x="28" y="40" font-size="18" font-weight="700" fill="#1b1f2a">Ensemble confidence and human-in-the-loop routing</text>
<text x="28" y="62" font-size="12.5" fill="#4b5163">backend/app/grading/ensemble.py + backend/app/pipeline/routing.py  ·  priors and thresholds are provisional (not yet fitted on teacher marks)</text>
<rect x="28" y="88" width="200" height="172" rx="10" fill="#ffffff" stroke="#d9d5f5" stroke-width="1.2"/>
<text x="42" y="112" font-size="13" font-weight="650" fill="#1b1f2a" text-anchor="start">Graders + priors</text>
<text x="42" y="134" font-size="11.5" font-weight="400" fill="#4b5163" text-anchor="start">AI marker (LLM)</text>
<text x="212" y="134" font-size="11.5" font-weight="650" fill="#1b1f2a" text-anchor="end">0.9</text>
<text x="42" y="152" font-size="11.5" font-weight="400" fill="#4b5163" text-anchor="start">NLI cross-encoder</text>
<text x="212" y="152" font-size="11.5" font-weight="650" fill="#1b1f2a" text-anchor="end">0.8</text>
<text x="42" y="170" font-size="11.5" font-weight="400" fill="#4b5163" text-anchor="start">Sentence-BERT</text>
<text x="212" y="170" font-size="11.5" font-weight="650" fill="#1b1f2a" text-anchor="end">0.7</text>
<text x="42" y="188" font-size="11.5" font-weight="400" fill="#4b5163" text-anchor="start">Lexical scorer</text>
<text x="212" y="188" font-size="11.5" font-weight="650" fill="#1b1f2a" text-anchor="end">0.6</text>
<text x="42" y="230" font-size="11.5" font-weight="400" fill="#4b5163" text-anchor="start">decider P + cross-checker S</text>
<rect x="256" y="88" width="216" height="172" rx="10" fill="#f3f1ff" stroke="#6d5ef5" stroke-width="1.6"/>
<text x="270" y="112" font-size="13" font-weight="650" fill="#4c3fd1" text-anchor="start">Grading confidence</text>
<text x="270" y="134" font-size="11.5" font-weight="400" fill="#4b5163" text-anchor="start">prior(decider) × agreement</text>
<text x="270" y="152" font-size="11.5" font-weight="400" fill="#4b5163" text-anchor="start"></text>
<text x="270" y="170" font-size="11.5" font-weight="400" fill="#4b5163" text-anchor="start">1.00 · every criterion agrees</text>
<text x="270" y="188" font-size="11.5" font-weight="400" fill="#4b5163" text-anchor="start">0.85 · not fully cross-checked</text>
<text x="270" y="206" font-size="11.5" font-weight="400" fill="#4b5163" text-anchor="start">0.45 · graders disagree</text>
<rect x="500" y="88" width="216" height="172" rx="10" fill="#ffffff" stroke="#d9d5f5" stroke-width="1.2"/>
<text x="514" y="112" font-size="13" font-weight="650" fill="#1b1f2a" text-anchor="start">Combined confidence</text>
<text x="514" y="134" font-size="11.5" font-weight="400" fill="#4b5163" text-anchor="start">p = OCR × grading × seg</text>
<text x="514" y="152" font-size="11.5" font-weight="400" fill="#4b5163" text-anchor="start">seg = min(1, 0.4 + 0.6 s/0.95)</text>
<text x="514" y="170" font-size="11.5" font-weight="400" fill="#4b5163" text-anchor="start"></text>
<text x="514" y="188" font-size="11.5" font-weight="400" fill="#4b5163" text-anchor="start">temperature scaling:</text>
<text x="514" y="206" font-size="11.5" font-weight="400" fill="#4b5163" text-anchor="start">calibrate(p, T) =</text>
<text x="514" y="224" font-size="11.5" font-weight="400" fill="#4b5163" text-anchor="start">sigmoid(logit(p) / T)</text>
<rect x="744" y="88" width="188" height="172" rx="10" fill="url(#gAccent)" stroke="none" stroke-width="1.2"/>
<text x="758" y="112" font-size="13" font-weight="650" fill="#ffffff" text-anchor="start">Route</text>
<text x="758" y="134" font-size="11.5" font-weight="400" fill="#ffffff" text-anchor="start">auto-accept when</text>
<text x="758" y="152" font-size="11.5" font-weight="400" fill="#ffffff" text-anchor="start">confidence ≥ 0.80</text>
<text x="758" y="170" font-size="11.5" font-weight="400" fill="#ffffff" text-anchor="start">and no review flag</text>
<text x="758" y="188" font-size="11.5" font-weight="400" fill="#ffffff" text-anchor="start"></text>
<text x="758" y="206" font-size="11.5" font-weight="400" fill="#ffffff" text-anchor="start">threshold is configurable</text>
<path d="M 228 174 L 256 174" fill="none" stroke="#8f88d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M 472 174 L 500 174" fill="none" stroke="#8f88d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M 716 174 L 744 174" fill="none" stroke="#8f88d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="500" y="300" width="210" height="96" rx="10" fill="#ecfdf3" stroke="#16a34a" stroke-width="1.6"/>
<text x="514" y="324" font-size="13.5" font-weight="650" fill="#15803d" text-anchor="start">auto_accepted</text>
<text x="514" y="346" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">marks go to results;</text>
<text x="514" y="364" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">still open for spot checks</text>
<rect x="728" y="300" width="204" height="96" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
<text x="742" y="324" font-size="13.5" font-weight="650" fill="#c2410c" text-anchor="start">needs_review</text>
<text x="742" y="346" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">teacher queue, riskiest first:</text>
<text x="742" y="364" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">lowest confidence on top</text>
<path d="M 800 260 L 800 280 L 605 280 L 605 300" fill="none" stroke="#8f88d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="700" y="274" font-size="11" font-weight="400" fill="#7a8094" text-anchor="middle" font-style="italic">yes</text>
<path d="M 860 260 L 860 300" fill="none" stroke="#8f88d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="876" y="286" font-size="11" font-weight="400" fill="#7a8094" text-anchor="middle" font-style="italic">no</text>
<text x="28" y="290" font-size="12.5" font-weight="650" fill="#1b1f2a" text-anchor="start">Examples of flags that send an answer to review</text>
<rect x="28.0" y="304" width="100.9" height="20" rx="10" fill="#f6f7f9" stroke="#cfd3dc" stroke-width="1"/>
<text x="78.5" y="318" font-size="11" font-weight="600" fill="#4b5163" text-anchor="middle">contradiction</text>
<rect x="136.9" y="304" width="120.1" height="20" rx="10" fill="#f6f7f9" stroke="#cfd3dc" stroke-width="1"/>
<text x="197.0" y="318" font-size="11" font-weight="600" fill="#4b5163" text-anchor="middle">graders_disagree</text>
<rect x="265.0" y="304" width="132.8" height="20" rx="10" fill="#f6f7f9" stroke="#cfd3dc" stroke-width="1"/>
<text x="331.4" y="318" font-size="11" font-weight="600" fill="#4b5163" text-anchor="middle">low_ocr_confidence</text>
<rect x="28.0" y="332" width="139.2" height="20" rx="10" fill="#f6f7f9" stroke="#cfd3dc" stroke-width="1"/>
<text x="97.6" y="346" font-size="11" font-weight="600" fill="#4b5163" text-anchor="middle">needs_transcription</text>
<rect x="175.2" y="332" width="113.7" height="20" rx="10" fill="#f6f7f9" stroke="#cfd3dc" stroke-width="1"/>
<text x="232.1" y="346" font-size="11" font-weight="600" fill="#4b5163" text-anchor="middle">copied_question</text>
<rect x="296.9" y="332" width="145.6" height="20" rx="10" fill="#f6f7f9" stroke="#cfd3dc" stroke-width="1"/>
<text x="369.7" y="346" font-size="11" font-weight="600" fill="#4b5163" text-anchor="middle">segmentation_warning</text>
<rect x="28.0" y="360" width="158.4" height="20" rx="10" fill="#f6f7f9" stroke="#cfd3dc" stroke-width="1"/>
<text x="107.2" y="374" font-size="11" font-weight="600" fill="#4b5163" text-anchor="middle">ai_unverified_evidence</text>
<rect x="194.4" y="360" width="139.2" height="20" rx="10" fill="#f6f7f9" stroke="#cfd3dc" stroke-width="1"/>
<text x="264.0" y="374" font-size="11" font-weight="600" fill="#4b5163" text-anchor="middle">maths_manual_review</text>
<text x="28" y="424" font-size="11.5" font-weight="400" fill="#7a8094" text-anchor="start" font-style="italic">Teacher edits re-grade the answer, overrides need a reason, approval locks the sheet, and every change goes to the append-only audit log.</text>
</svg>