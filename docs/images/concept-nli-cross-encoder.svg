<svg xmlns="http://www.w3.org/2000/svg" width="960" height="452" viewBox="0 0 960 452" role="img" aria-label="NLI cross-encoder: premise and hypothesis to entailment, neutral, contradiction probabilities" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>NLI cross-encoder: premise and hypothesis to entailment, neutral, contradiction probabilities</title>
<defs>
<linearGradient id="gAccent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d5ef5"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8f88d6"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="451" rx="14" fill="#fcfcff" stroke="#e4e1f7"/>
<rect x="0.5" y="0.5" width="959" height="5" rx="2" fill="url(#gAccent)"/>
<text x="28" y="40" font-size="18" font-weight="700" fill="#1b1f2a">Natural Language Inference: does the answer entail the key point?</text>
<text x="28" y="62" font-size="12.5" fill="#4b5163">One model reads each (student answer window, rubric key point) pair together  ·  backend/app/grading/onnx_nli.py</text>
<rect x="28" y="88" width="262" height="108" rx="10" fill="#ffffff" stroke="#d9d5f5" stroke-width="1.2"/>
<text x="42" y="112" font-size="13.5" font-weight="650" fill="#1b1f2a" text-anchor="start">Premise · student answer window</text>
<text x="42" y="134" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">"An overfitted model memorises the</text>
<text x="42" y="152" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">noise in its training data, so it</text>
<text x="42" y="170" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">fails on new examples."</text>
<rect x="28" y="214" width="262" height="108" rx="10" fill="#f3f1ff" stroke="#6d5ef5" stroke-width="1.6"/>
<text x="42" y="238" font-size="13.5" font-weight="650" fill="#4c3fd1" text-anchor="start">Hypothesis · rubric key point</text>
<text x="42" y="260" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">"The model learns noise in the</text>
<text x="42" y="278" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">training data and generalises</text>
<text x="42" y="296" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">poorly to unseen data."</text>
<rect x="318" y="128" width="170" height="154" rx="10" fill="#ffffff" stroke="#d9d5f5" stroke-width="1.2"/>
<text x="332" y="152" font-size="13.5" font-weight="650" fill="#1b1f2a" text-anchor="start">Tokenizer</text>
<text x="332" y="174" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">pair encoding:</text>
<text x="332" y="192" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">[CLS] premise</text>
<text x="332" y="210" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">[SEP] hypothesis</text>
<text x="332" y="228" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">[SEP]</text>
<rect x="516" y="88" width="196" height="234" rx="10" fill="url(#gAccent)" stroke="none" stroke-width="1.2"/>
<text x="530" y="112" font-size="13.5" font-weight="650" fill="#ffffff" text-anchor="start">DeBERTa-v3-xsmall</text>
<text x="530" y="134" font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">cross-encoder: one</text>
<text x="530" y="152" font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">Transformer reads both</text>
<text x="530" y="170" font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">texts with joint</text>
<text x="530" y="188" font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">self-attention</text>
<text x="530" y="206" font-size="12" font-weight="400" fill="#ffffff" text-anchor="start"></text>
<text x="530" y="224" font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">dynamic int8 ONNX, 87 MB</text>
<text x="530" y="242" font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">ONNX Runtime on CPU</text>
<text x="530" y="260" font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">45-85 ms per pair</text>
<path d="M 290 142 L 304 142 L 304 190 L 318 190" fill="none" stroke="#8f88d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M 290 268 L 304 268 L 304 220 L 318 220" fill="none" stroke="#8f88d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M 488 205 L 516 205" fill="none" stroke="#8f88d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="740" y="88" width="192" height="234" rx="10" fill="#ffffff" stroke="#d9d5f5" stroke-width="1.2"/>
<text x="754" y="112" font-size="13.5" font-weight="650" fill="#1b1f2a" text-anchor="start">Softmax over 3 labels</text>
<text x="754" y="130" font-size="11" font-weight="400" fill="#7a8094" text-anchor="start" font-style="italic">illustrative values</text>
<text x="754" y="158" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">entailment</text>
<rect x="754" y="166" width="164" height="12" rx="4" fill="#eef0f4"/>
<rect x="754" y="166" width="149.2" height="12" rx="4" fill="#16a34a"/>
<text x="918" y="158" font-size="12" font-weight="650" fill="#1b1f2a" text-anchor="end">0.91</text>
<text x="754" y="210" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">neutral</text>
<rect x="754" y="218" width="164" height="12" rx="4" fill="#eef0f4"/>
<rect x="754" y="218" width="11.5" height="12" rx="4" fill="#94a3b8"/>
<text x="918" y="210" font-size="12" font-weight="650" fill="#1b1f2a" text-anchor="end">0.07</text>
<text x="754" y="262" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">contradiction</text>
<rect x="754" y="270" width="164" height="12" rx="4" fill="#eef0f4"/>
<rect x="754" y="270" width="3.3" height="12" rx="4" fill="#dc2626"/>
<text x="918" y="262" font-size="12" font-weight="650" fill="#1b1f2a" text-anchor="end">0.02</text>
<path d="M 712 205 L 740 205" fill="none" stroke="#8f88d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="28" y="356" font-size="12.5" font-weight="650" fill="#1b1f2a" text-anchor="start">Decision per key point (NLI defaults: τ = 0.5, τ_low = 0.15, contradiction c = 0.95)</text>
<rect x="28" y="370" width="214" height="62" rx="10" fill="#ecfdf3" stroke="#16a34a" stroke-width="1.6"/>
<text x="42" y="394" font-size="13" font-weight="650" fill="#15803d" text-anchor="start">matched</text>
<text x="42" y="416" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">E ≥ τ  →  full weight</text>
<rect x="256" y="370" width="214" height="62" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
<text x="270" y="394" font-size="13" font-weight="650" fill="#c2410c" text-anchor="start">partial</text>
<text x="270" y="416" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">E ≥ τ_low  →  half weight</text>
<rect x="484" y="370" width="214" height="62" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="498" y="394" font-size="13" font-weight="650" fill="#b91c1c" text-anchor="start">contradicted</text>
<text x="498" y="416" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">C ≥ c  →  0 marks + flag</text>
<rect x="712" y="370" width="214" height="62" rx="10" fill="#f6f7f9" stroke="#cfd3dc" stroke-width="1.2"/>
<text x="726" y="394" font-size="13" font-weight="650" fill="#4b5163" text-anchor="start">missed</text>
<text x="726" y="416" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">otherwise  →  0 marks</text>
</svg>