<svg xmlns="http://www.w3.org/2000/svg" width="960" height="452" viewBox="0 0 960 452" role="img" aria-label="LLM marker pipeline: anonymise, prompt, router, strict JSON, quote verification, marks in code" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>LLM marker pipeline: anonymise, prompt, router, strict JSON, quote verification, marks in code</title>
<defs>
<linearGradient id="gAccent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d5ef5"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8f88d6"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="451" rx="14" fill="#fcfcff" stroke="#e4e1f7"/>
<rect x="0.5" y="0.5" width="959" height="5" rx="2" fill="url(#gAccent)"/>
<text x="28" y="40" font-size="18" font-weight="700" fill="#1b1f2a">AI marker: the LLM judges, the code decides the marks</text>
<text x="28" y="62" font-size="12.5" fill="#4b5163">One request per answer sheet  ·  backend/app/grading/llm_grader.py + backend/app/llm/  ·  off unless SARAS_AI_GRADING=ensemble and SARAS_AI_CONSENT=true</text>
<rect x="28" y="86" width="208" height="132" rx="10" fill="#ffffff" stroke="#d9d5f5" stroke-width="1.2"/>
<text x="42" y="110" font-size="13" font-weight="650" fill="#1b1f2a" text-anchor="start">1 · Anonymise</text>
<text x="42" y="132" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">llm/redact.py removes e-mails,</text>
<text x="42" y="150" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">URLs, phone numbers, roll</text>
<text x="42" y="168" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">numbers and labelled names</text>
<rect x="260" y="86" width="208" height="132" rx="10" fill="#ffffff" stroke="#d9d5f5" stroke-width="1.2"/>
<text x="274" y="110" font-size="13" font-weight="650" fill="#1b1f2a" text-anchor="start">2 · Build the prompt</text>
<text x="274" y="132" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">question + model answer +</text>
<text x="274" y="150" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">key points &amp; weights +</text>
<text x="274" y="168" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">marking style (lenient ...</text>
<text x="274" y="186" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">strict); answer = data only</text>
<rect x="492" y="86" width="208" height="132" rx="10" fill="#f3f1ff" stroke="#6d5ef5" stroke-width="1.6"/>
<text x="506" y="110" font-size="13" font-weight="650" fill="#4c3fd1" text-anchor="start">3 · LLM router</text>
<text x="506" y="132" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">sha256 cache → Groq gpt-oss</text>
<text x="506" y="150" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">-120b → gpt-oss-20b →</text>
<text x="506" y="168" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">Gemini Flash-Lite; retries,</text>
<text x="506" y="186" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">token buckets, daily budget</text>
<rect x="724" y="86" width="208" height="132" rx="10" fill="#ffffff" stroke="#d9d5f5" stroke-width="1.2"/>
<text x="738" y="110" font-size="13" font-weight="650" fill="#1b1f2a" text-anchor="start">4 · Strict JSON output</text>
<text x="738" y="132" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">Pydantic model → strict</text>
<text x="738" y="150" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">JSON Schema; per key point:</text>
<text x="738" y="168" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">verdict + verbatim quote</text>
<text x="738" y="186" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">(never marks)</text>
<path d="M 236 152 L 260 152" fill="none" stroke="#8f88d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M 468 152 L 492 152" fill="none" stroke="#8f88d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M 700 152 L 724 152" fill="none" stroke="#8f88d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="28" y="262" width="208" height="132" rx="10" fill="url(#gAccent)" stroke="none" stroke-width="1.2"/>
<text x="42" y="286" font-size="13" font-weight="650" fill="#ffffff" text-anchor="start">8 · Routing</text>
<text x="42" y="308" font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">confidence × OCR × segmentation</text>
<text x="42" y="326" font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">→ auto_accepted or</text>
<text x="42" y="344" font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">needs_review (teacher)</text>
<rect x="260" y="262" width="208" height="132" rx="10" fill="#ffffff" stroke="#d9d5f5" stroke-width="1.2"/>
<text x="274" y="286" font-size="13" font-weight="650" fill="#1b1f2a" text-anchor="start">7 · Ensemble</text>
<text x="274" y="308" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">AI decides, offline NLI /</text>
<text x="274" y="326" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">lexical cross-check; any</text>
<text x="274" y="344" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">disagreement is disputed</text>
<text x="274" y="362" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">→ graders_disagree</text>
<rect x="492" y="262" width="208" height="132" rx="10" fill="#ffffff" stroke="#d9d5f5" stroke-width="1.2"/>
<text x="506" y="286" font-size="13" font-weight="650" fill="#1b1f2a" text-anchor="start">6 · Marks in code</text>
<text x="506" y="308" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">matched 1, partial 0.5,</text>
<text x="506" y="326" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">missed / contradicted 0</text>
<text x="506" y="344" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">x weight; capped and</text>
<text x="506" y="362" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">rounded; verdict derived</text>
<rect x="724" y="262" width="208" height="132" rx="10" fill="#f3f1ff" stroke="#6d5ef5" stroke-width="1.6"/>
<text x="738" y="286" font-size="13" font-weight="650" fill="#4c3fd1" text-anchor="start">5 · Verify every quote</text>
<text x="738" y="308" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">exact or fuzzy word alignment</text>
<text x="738" y="326" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">in the student's own text;</text>
<text x="738" y="344" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">numbers &amp; negations must</text>
<text x="738" y="362" font-size="12" font-weight="400" fill="#4b5163" text-anchor="start">match; else → missed</text>
<path d="M 828.0 218 L 828.0 262" fill="none" stroke="#8f88d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M 724 328 L 700 328" fill="none" stroke="#8f88d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M 492 328 L 468 328" fill="none" stroke="#8f88d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M 260 328 L 236 328" fill="none" stroke="#8f88d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="28" y="424" font-size="11.5" font-weight="400" fill="#7a8094" text-anchor="start" font-style="italic">Any AI failure (no consent, no key, 5xx, timeout, invalid JSON) keeps the offline result and adds ai_unavailable_fallback: a sheet never fails because of the AI.</text>
</svg>